allprojects {
    group = project.group
    version = project.version

    // Read by the io.ballerina.plugin at apply time. Without them the plugin
    // fails before it does anything, with "Cannot get property
    // 'timestampedVersionRegex' on extra properties extension as it does not
    // exist". They were lost when this file was trimmed down from the
    // ballerina-platform module template.
    ext {
        snapshotVersion = '-SNAPSHOT'
        timestampedVersionRegex = '.*-\\d{8}-\\d{6}-\\w.*$'
    }

    repositories {
        mavenLocal()
        maven {
            url = 'https://maven.wso2.org/nexus/content/repositories/releases/'
        }
        maven {
            url = 'https://maven.wso2.org/nexus/content/groups/wso2-public/'
        }
        maven {
            url = 'https://repo.maven.apache.org/maven2'
        }
        maven {
            url = 'https://maven.pkg.github.com/ballerina-platform/*'
            credentials {
                username System.getenv("packageUser")
                password System.getenv("packagePAT")
            }
        }
    }
}

subprojects {
    configurations {
        jbalTools
    }

    dependencies {
        // The io.ballerina.plugin runs the build through a Ballerina
        // distribution it unpacks under build/jballerina-tools-<version>,
        // rather than whatever `bal` happens to be on PATH. Without this
        // configuration that directory never exists and every plugin task
        // fails with exit 127 -- "command not found" -- naming a bal binary
        // one directory deep in the build output.
        //
        // Resolving it needs ballerina-platform GitHub Packages credentials
        // in packageUser / packagePAT, as the module-creation guide requires.
        jbalTools("org.ballerinalang:jballerina-tools:${ballerinaLangVersion}") {
            transitive = false
        }
    }
}

task build {
    dependsOn(':a2a-ballerina:build')
}

task test {
    dependsOn(':a2a-ballerina:test')
}

// Turns a Gradle version into the plain version a Ballerina.toml carries:
// strips the -SNAPSHOT suffix, or the trailing timestamp of a
// timestamped build. Used by the ballerina subproject's updateTomlFiles.
def stripBallerinaExtensionVersion(String extVersion) {
    if (extVersion.matches(project.ext.timestampedVersionRegex)) {
        def splitVersion = extVersion.split('-')
        if (splitVersion.length > 3) {
            def strippedValues = splitVersion[0..-4]
            return strippedValues.join('-')
        } else {
            return extVersion
        }
    } else {
        return extVersion.replace("${project.ext.snapshotVersion}", "")
    }
}

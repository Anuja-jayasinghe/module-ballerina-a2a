org.gradle.caching=true

group=io.ballerina.lib
version=0.1.0-SNAPSHOT

ballerinaLangVersion=2201.13.5
ballerinaGradlePluginVersion=4.0.0
releasePluginVersion=3.1.0

# The jballerina-tools distribution the io.ballerina.plugin unpacks ships
# only the lang libraries and ballerina/test; every other standard library
# has to be copied in through the ballerinaStdLibs configuration in
# build.gradle. These are the versions this package resolves against
# distribution 2201.13.5 -- keep them in step with ballerina/Dependencies.toml,
# which is the record of what the build actually resolved. Grouped by
# ballerina-library build level, following the module-ballerina-ai layout.

# Level 01
stdlibIoVersion=1.8.1
stdlibTimeVersion=2.8.1
stdlibUrlVersion=2.6.2

# Level 02
stdlibConstraintVersion=1.7.0
stdlibCryptoVersion=2.12.1
stdlibLogVersion=2.17.0
stdlibOsVersion=1.10.1
stdlibTaskVersion=2.11.2

# Level 03
stdlibCacheVersion=3.10.0
stdlibFileVersion=1.13.1
stdlibMimeVersion=2.12.2
stdlibUuidVersion=1.10.0

# Level 04
stdlibAuthVersion=2.14.0
stdlibDataJsonDataVersion=1.1.4
stdlibJwtVersion=2.15.1
stdlibOAuth2Version=2.15.0

# Level 05
stdlibHttpVersion=2.17.1

# Ballerinax Observer
observeVersion=1.7.2
observeInternalVersion=1.5.0
